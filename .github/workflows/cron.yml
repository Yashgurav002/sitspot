name: cron
# Laptop hosting: secrets API_URL=https://<NGROK_DOMAIN> (ngrok -> API :8787), WEB_URL=https://<app>.vercel.app. GitHub can only reach the
# laptop through the tunnel; scripts/hourly.mjs (started by `pnpm start`) does the pull + forecast locally anyway.
# GitHub cron: UTC, minimum 5-minute interval, runs can be late. Each `if:` must match its cron string exactly.
on:
  schedule:
    - cron: "*/10 * * * *" # keep-alive (Render free tier sleeps after 15 min idle; harmless on the laptop)
    - cron: "5 * * * *" # hourly data pull
    - cron: "15 * * * *" # hourly TabPFN forecast
  workflow_dispatch: {}

concurrency:
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ secrets.API_URL }}
      WEB_URL: ${{ secrets.WEB_URL }}
    steps:
      - name: Ping API /health
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL secret not set; skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-all-errors --max-time 120 "$API_URL/health"
      - name: Ping web
        run: |
          if [ -z "$WEB_URL" ]; then echo "WEB_URL secret not set; skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-all-errors --max-time 120 -o /dev/null "$WEB_URL"

  pull:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /cron/pull
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "API_URL/CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-all-errors --max-time 120 -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/cron/pull"

  forecast:
    needs: [pull]
    # workflow_dispatch runs pull then forecast; on the :15 schedule pull is skipped, so don't require success.
    if: ${{ always() && (github.event.schedule == '15 * * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # API mode (laptop + ngrok, PGlite): API_URL = https://<NGROK_DOMAIN> and CRON_SECRET; reads input from
    # /cron/forecast-input and POSTs to /cron/forecast-ingest. Needs the training CSV committed at
    # ml/tabpfn/training.csv (cache/ is gitignored). The laptop runs the same job itself (scripts/hourly.mjs),
    # so this is only a backup and only works while the laptop and tunnel are up.
    # DB mode: DATABASE_URL (Postgres) instead.
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick mode
        id: gate
        run: |
          if [ -n "$API_URL" ] && [ -n "$CRON_SECRET" ] && [ -f ml/tabpfn/training.csv ]; then echo "args=--api $API_URL --train ml/tabpfn/training.csv" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DATABASE_URL" ]; then echo "args=" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "Neither API_URL+CRON_SECRET+ml/tabpfn/training.csv nor DATABASE_URL; skipping"; echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/tabpfn/requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r ml/tabpfn/requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: python ml/tabpfn/forecast_job.py ${{ steps.gate.outputs.args }}
